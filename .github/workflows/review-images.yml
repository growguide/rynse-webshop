name: Fetch images for review

# Helper for the build session (the workspace cannot reach the Higgsfield CDN):
# downloads the given URLs, downsizes them and commits JPEG previews to the asset-review branch.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Comma-separated image URLs
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --quiet "pillow>=11.2"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and downsize
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p review
          python3 - <<'PY'
          import os, io, urllib.request, hashlib
          from PIL import Image
          import subprocess
          for i, u in enumerate([x.strip() for x in os.environ['URLS'].split(',') if x.strip()]):
              data = urllib.request.urlopen(u, timeout=120).read()
              name = hashlib.sha1(u.encode()).hexdigest()[:10]
              if u.lower().split('?')[0].endswith(('.mp4', '.webm', '.mov')):
                  open('clip.mp4', 'wb').write(data)
                  # 16-frame contact sheet (4x4) + the exact last frame
                  subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', 'clip.mp4', '-vf', "select='not(mod(n\\,max(1\\,floor(N/16))))',scale=360:-2,tile=4x4", '-frames:v', '1', f'review/{i}-{name}-sheet.jpg'], check=True)
                  subprocess.run(['ffmpeg', '-v', 'error', '-y', '-sseof', '-0.05', '-i', 'clip.mp4', '-frames:v', '1', '-update', '1', '-vf', 'scale=720:-2', f'review/{i}-{name}-last.jpg'], check=True)
                  print(i, u, 'video')
              else:
                  im = Image.open(io.BytesIO(data)).convert('RGB'); im.thumbnail((1400, 1400))
                  im.save(f'review/{i}-{name}.jpg', quality=85)
                  print(i, u, im.size)
          PY
      - name: Commit to asset-review branch
        run: |
          git config user.name "rynse-assets-bot"
          git config user.email "assets-bot@users.noreply.github.com"
          git checkout -B asset-review
          git add review
          git commit -m "review images" || true
          git push -f origin asset-review
