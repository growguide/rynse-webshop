name: Process brand assets

# Downloads the Higgsfield-generated sources listed in assets-src/manifest.json,
# converts them into optimized web assets (WebP/AVIF, hero frame sequences, icons)
# and commits the result. Runs when the manifest changes or on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets-src/manifest.json'
      - 'tools/process-assets.py'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet "pillow>=11.2"
      - name: Process assets
        run: python3 tools/process-assets.py
      - name: Keep originals as a build artifact (not committed)
        uses: actions/upload-artifact@v4
        with:
          name: brand-assets-source
          path: |
            assets-src/*.png
            assets-src/*.mp4
          retention-days: 90
      - name: Commit optimized assets
        run: |
          git config user.name "rynse-assets-bot"
          git config user.email "assets-bot@users.noreply.github.com"
          git add src/web/assets
          git diff --cached --quiet && echo "No asset changes" && exit 0
          git commit -m "chore(assets): process brand assets [skip ci]"
          git push
